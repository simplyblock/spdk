name: build_image_spdk_core_amd

on:
  workflow_run:
    workflows: ["build_image_spdk_core_arm"]
    types:
      - completed


jobs:
  build:
    # Pinned rather than ubuntu-latest: a runner image upgrade changes what
    # `docker build` pushes, so moving to a new image should be a deliberate edit.
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout the triggered branch
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.workflow_run.head_branch }}

    # Same sanitising as the TAG of build_image_spdk_core_arm ('/' -> '-'), so
    # both workflows push <tag>-arm64 / <tag>-amd64 under one name and a branch
    # such as fix/foo yields a valid image tag.
    - name: Set branch name from triggered workflow
      env:
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: echo "BRANCH_NAME=$(echo "$HEAD_BRANCH" | sed 's/\//-/g')" >> $GITHUB_ENV

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_SADEGH }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SADEGH }}
        aws-region: us-east-1

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build the docker image
      run: docker build --file docker/Dockerfile_spdk --tag simplyblock/spdk-core:$BRANCH_NAME-amd64 .

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: hamdysimplyblock
        password: ${{ secrets.DOCKER_PASS }}

    - name: Push Images
      run: docker push simplyblock/spdk-core:$BRANCH_NAME-amd64

    - name: Tag docker image
      run: docker tag simplyblock/spdk-core:$BRANCH_NAME-amd64 565979732541.dkr.ecr.us-east-1.amazonaws.com/spdk-core:$BRANCH_NAME-amd64

    - name: Push the docker image
      run: docker image push 565979732541.dkr.ecr.us-east-1.amazonaws.com/spdk-core:$BRANCH_NAME-amd64

    # `docker buildx imagetools create` rather than `docker manifest create`:
    # the per-arch tags may themselves be manifest lists (a build with a
    # provenance attestation pushes one), which `docker manifest create` refuses.
    # imagetools assembles the multi-arch tag in the registry and pushes it.
    # Only when the arm build succeeded: otherwise <tag>-arm64 is missing or left
    # over from an older commit, and -latest would pair mismatched images.
    - name: Create the manifest
      if: github.event.workflow_run.conclusion == 'success'
      run: |
        docker buildx imagetools create \
          --tag simplyblock/spdk-core:$BRANCH_NAME-latest \
          simplyblock/spdk-core:$BRANCH_NAME-arm64 \
          simplyblock/spdk-core:$BRANCH_NAME-amd64
        docker buildx imagetools create \
          --tag 565979732541.dkr.ecr.us-east-1.amazonaws.com/spdk-core:$BRANCH_NAME-latest \
          565979732541.dkr.ecr.us-east-1.amazonaws.com/spdk-core:$BRANCH_NAME-arm64 \
          565979732541.dkr.ecr.us-east-1.amazonaws.com/spdk-core:$BRANCH_NAME-amd64
